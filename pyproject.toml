[project]
name = "typer-agentic"
version = "0.1.3"
description = "Typer extension that makes CLIs friendly to coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mojzis", email = "mojzisek@gmail.com" }]
keywords = ["typer", "cli", "agent", "llm", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.24",
]

[project.urls]
homepage = "https://github.com/mojzis/typer-agentic"
repository = "https://github.com/mojzis/typer-agentic"
documentation = "https://github.com/mojzis/typer-agentic#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typer_agentic"]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "pytest-xdist>=3.8.0",
    "pytest-randomly>=4.1.0",
    "vulture",
    "deptry",
    "poethepoet",
    "ty-find>=0.4.5",
    "biston>=0.7.0",
    "madoqua>=0.2.2",
    "gerenuk>=0.3.1",
    "zorilla>=0.2.1",
    "pycoati>=0.2.7",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "T20", "PTH", "ERA", "PL", "TRY", "RUF", "S", "PERF", "FURB"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913", "S", "TRY003", "PLC0415", "E501", "B006", "B008"]

[tool.ruff.format]

[tool.ty]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.deptry]
known_first_party = ["typer_agentic"]

[tool.poe]
verbosity = -1

[tool.poe.tasks.fix]
sequence = [
    { cmd = "ruff format --quiet ." },
    { cmd = "ruff check --fix --quiet ." },
]
help = "Auto-fix: format and lint"

[tool.poe.tasks.lint]
cmd = "ruff check ."
help = "Run linter (no fix)"

[tool.poe.tasks.typecheck]
cmd = "ty check"
help = "Run type checker"

[tool.poe.tasks.test]
cmd = "pytest -q --tb=short -n auto"
help = "Run tests (parallel)"

[tool.poe.tasks.test-quick]
cmd = "pytest -o addopts= -x -qq --tb=line --no-header -n auto"
help = "Fail-fast tests: no coverage, minimal output, parallel (used by `check`)"

[tool.poe.tasks.test-compat]
shell = "uv run --no-project --refresh-package typer-agentic --with 'typer==0.25.*' --with pytest --with . pytest tests -q -o addopts= -p no:cacheprovider"
interpreter = "bash"
help = "Run the suite against Typer 0.25 (external Click) — the pre-vendoring baseline"

[tool.poe.tasks.vulns]
shell = "uvx pysentry-rs --compact . || true"
interpreter = "bash"
help = "Dependency vulnerability scan"

[tool.poe.tasks.dead-code]
cmd = "vulture src"
help = "Dead code detection"

[tool.poe.tasks.unused-deps]
cmd = "deptry ."
help = "Unused dependency check"

[tool.poe.tasks.clones]
cmd = "biston scan ."
help = "Structural clone detection (advisory)"

[tool.poe.tasks._check-parallel]
shell = """
  ruff check . &
  ty check &
  vulture src &
  deptry . &
  biston scan . &
  (uvx pysentry-rs --compact . || true) &
  wait
"""
interpreter = "bash"

[tool.poe.tasks.check-fast]
shell = """
  ruff check . &
  ty check &
  wait
"""
interpreter = "bash"
help = "Lint + typecheck only — sub-second feedback loop"

[tool.poe.tasks.check]
sequence = [
    { ref = "_check-parallel" },
    { ref = "test-quick" },
]
help = "Run all checks (parallel where possible)"

[tool.poe.tasks.check-all]
sequence = [
    { ref = "lint" },
    { ref = "typecheck" },
    { ref = "vulns" },
    { ref = "dead-code" },
    { ref = "unused-deps" },
    { ref = "clones" },
    { ref = "test" },
]
ignore_fail = true
help = "Run all checks (report all failures)"

[tool.poe.tasks.setup]
cmd = "madoqua install"
help = "Install the madoqua pre-commit hook (sets core.hooksPath=hooks)"

[tool.poe.tasks.release]
shell = """
  uv version --bump ${level:-patch} && \
  uv lock --quiet && \
  v=$(uv version --short) && \
  git commit -am "Release v$v" && \
  git tag "v$v" && \
  git push origin HEAD "v$v"
"""
interpreter = "bash"
help = "Bump version (level=patch|minor|major, default patch), commit, tag, push"

[tool.madoqua]
# fix phase keeps the defaults: ruff check --fix, ruff format (re-staged).
# check phase keeps the defaults (ruff check, ty check) and adds:
extend_check = [
    # madoqua appends the staged .py files. biston reads them as --focus-args focus files
    # (only clone pairs touching a staged file); zorilla lints exactly those files.
    { name = "biston",  cmd = "biston scan --focus-args", timeout_s = 60,  max_output_lines = 80 },
    { name = "zorilla", cmd = "zorilla check",            timeout_s = 30,  max_output_lines = 80 },
    # gerenuk scopes itself from the git diff, so no file list.
    { name = "gerenuk", cmd = "gerenuk run -- -q",        pass_files = false, timeout_s = 120, max_output_lines = 120 },
]

[tool.biston.scan]
exclude = ["tests/**", "**/conftest.py"]

[tool.zorilla.rules.ZR005]
# tests/test_compat.py fakes sys.argv[0] to check program-name detection; the path is test data.
allowed_prefixes = ["/usr/bin/mytool"]
